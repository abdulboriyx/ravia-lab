name: Validate and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Spatial RAVIA tests
        run: npm run test:spatial

      - name: Spatial RAVIA scientific evaluation
        run: npm run eval:spatial
        env:
          SPATIAL_RAVIA_EVAL_THRESHOLD: "1"

      - name: ChapterBio install dependencies
        working-directory: chapterbio
        run: npm ci

      - name: ChapterBio tests
        working-directory: chapterbio
        run: npm test

      - name: ChapterBio build
        working-directory: chapterbio
        run: npm run build

      - name: Build static site
        run: npm run build

      - name: Spatial RAVIA static smoke
        run: npm run smoke:spatial

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
